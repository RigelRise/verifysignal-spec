[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verifysignal-spec"
version = "0.25.1"
description = "Project-local CLI and coding-agent interface for VerifySignal use cases."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Thiago Valentim" }]
keywords = [
  "browser-testing",
  "end-to-end-testing",
  "test-automation",
  "quality-assurance",
  "validation",
  "playwright",
  "ai-agents",
  "claude",
  "codex",
  "deterministic",
  "evidence",
  "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Testing :: Acceptance",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "PyYAML>=6",
  "pydantic>=2",
  "pathspec>=0.12",
  "packaging>=23",
  "cryptography>=42",
  "tomlkit>=0.13,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8"]
publish = ["build>=1", "twine>=5"]

[project.urls]
Homepage = "https://github.com/RigelRise/verifysignal-spec"
Repository = "https://github.com/RigelRise/verifysignal-spec"
Documentation = "https://github.com/RigelRise/verifysignal-spec/tree/main/docs"
Issues = "https://github.com/RigelRise/verifysignal-spec/issues"
Changelog = "https://github.com/RigelRise/verifysignal-spec/blob/main/CHANGELOG.md"

[project.scripts]
verifysignal = "verifysignal_spec.cli:main"
verifysignal-spec = "verifysignal_spec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
verifysignal_spec = ["templates/**/*.md", "templates/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
