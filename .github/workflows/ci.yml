# Spec CI — the per-repo gate: the full pytest suite (unit + contract + integration against the
# in-process fake backend; sibling-dependent tests self-skip here and are enforced by the
# cross-repo product-truth gate in the Core repo).
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global @openai/codex@0.145.0
      - run: npm install --global @anthropic-ai/claude-code@2.1.220
      - run: python -m pip install -e .
      - run: python -m pip install pytest
      - run: verifysignal integration setup-playwright-mcp --json
        env:
          VERIFYSIGNAL_PLAYWRIGHT_MCP_CACHE_DIR: ${{ runner.temp }}/verifysignal-playwright-mcp
      - run: python -m pytest -q
        env:
          # PR gate: install the exact pinned provider, start it through the
          # generated CLI launcher, and require MCP initialize + tools/list.
          VERIFYSIGNAL_RUN_REAL_MCP_TESTS: "1"
          # Start Codex from a clean user config and fresh untrusted project,
          # with no launch overrides, and require the user-scoped Playwright
          # server plus its browser tools.
          VERIFYSIGNAL_RUN_REAL_CODEX_TESTS: "1"
          # Register through Claude's public user-scope MCP command, then
          # discover the server from a second clean project.
          VERIFYSIGNAL_RUN_REAL_CLAUDE_TESTS: "1"
          VERIFYSIGNAL_PLAYWRIGHT_MCP_CACHE_DIR: ${{ runner.temp }}/verifysignal-playwright-mcp

  # Native coverage for the Windows-only safety primitives used by every
  # protected run. Keep this focused: the full suite still depends on POSIX
  # executable fixtures, while these modules are deliberately cross-platform.
  windows-safety:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - name: Exercise mutex, durable replacement, authority paths, and owned requests
        run: >-
          python -m pytest -q
          tests/unit/test_run_invocation_lock.py
          tests/unit/test_durable_run_persistence.py
          tests/unit/test_authority_path_safety.py
          tests/unit/test_run_request_preparation.py
          tests/unit/test_workspace_layout_portability.py
          tests/unit/test_run_history_filename_portability.py

  # The Windows leg of the SAME gate. Every other job in every repo runs on ubuntu, which is why
  # Windows was the one platform that broke: nobody had ever run it. A real user hit
  # `platform.unsupported` on `verifysignal init` after the landing page began advertising this
  # installer.
  #
  # This proves the CUSTOMER path, not the contributor one: the advertised PowerShell installer, the
  # CLI it produces, and the Playwright MCP provider setup. It deliberately does NOT run pytest --
  # the suite's fixtures are shebang scripts, and contributing still requires mac or Linux.
  #
  # windows-latest bills at 2x on private repos; this repo is public, so the trade is cheap here.
  windows-install:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # `-From` points at THIS checkout, so the code under review is what gets installed. Without it
      # the job would prove that PyPI works, not that the pull request does.
      - name: Bootstrap through the advertised Windows installer
        run: pwsh -File scripts/install.ps1 -From "$env:GITHUB_WORKSPACE"

      # A new process, so this also proves the installer put the CLI somewhere PATH can find.
      - name: The installed CLI runs
        run: verifysignal --version

      # First exercise anywhere of the `.cmd` branch in _playwright_mcp_executable and of the
      # `sys.platform == "win32"` bypass of the os.access(X_OK) check — both were dead code until now.
      - name: The pinned Playwright MCP provider installs and handshakes on Windows
        run: verifysignal integration setup-playwright-mcp --json
        env:
          VERIFYSIGNAL_PLAYWRIGHT_MCP_CACHE_DIR: ${{ runner.temp }}\verifysignal-playwright-mcp

  # Branch protection requires the stable `spec` context. Keep the expensive
  # Ubuntu and Windows customer-path legs parallel, then make that protected
  # context fail unless both platform results are green.
  spec:
    if: ${{ always() }}
    needs: [spec-tests, windows-safety, windows-install]
    runs-on: ubuntu-latest
    steps:
      - name: Require Ubuntu and Windows gates
        env:
          SPEC_TESTS_RESULT: ${{ needs.spec-tests.result }}
          WINDOWS_SAFETY_RESULT: ${{ needs.windows-safety.result }}
          WINDOWS_INSTALL_RESULT: ${{ needs.windows-install.result }}
        run: |
          test "$SPEC_TESTS_RESULT" = success
          test "$WINDOWS_SAFETY_RESULT" = success
          test "$WINDOWS_INSTALL_RESULT" = success
