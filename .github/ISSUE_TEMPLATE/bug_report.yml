name: Bug report
description: Something in the verifysignal CLI or workflow is not behaving as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please **never paste real credentials, tokens, or
        captured evidence** — redacted excerpts are enough. Suspected security
        issues should go through [SECURITY.md](../blob/main/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands or `/verifysignal-*` stages you ran.
      placeholder: |
        1. verifysignal init --here --integration claude
        2. verifysignal ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: Output of `verifysignal check`
      description: Workspace, runtime, and entitlement readiness. Redact anything sensitive.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `verifysignal --version`.
      placeholder: "0.19.0"
    validations:
      required: true
  - type: dropdown
    id: integration
    attributes:
      label: Coding agent
      options:
        - Claude Code
        - Codex
        - Not applicable / CLI only
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Python/Node versions
      placeholder: "macOS 14 · Python 3.12 · Node 24"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste with `--profile debug` if useful. Redact tokens and URLs with secrets.
      render: shell
