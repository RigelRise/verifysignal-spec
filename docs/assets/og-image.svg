  <text x="200" y="152" font-size="52" font-weight="700" letter-spacing="-0.5"><tspan fill="#DEE8E8">Verify</tspan><tspan fill="#22C1AE">Signal</tspan></text>
  <text x="82" y="320" font-size="60" font-weight="800" fill="#F2F7F7" letter-spacing="-1">AI writes the validation.</text>
  <text x="82" y="392" font-size="60" font-weight="800" fill="#22C1AE" letter-spacing="-1">A deterministic runtime proves it.</text>
  <text x="82" y="470" font-size="27" fill="#9CAFB0">Turn product flows into repeatable browser validations — with evidence.</text>
